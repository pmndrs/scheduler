name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGE_TARBALL: /tmp/scheduler-package.tgz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm CLI
        run: npm install --global npm@11.5.1

      - name: Verify npm CLI version
        run: npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify package
        run: pnpm run ci

      - name: Smoke-test and retain packed package
        run: pnpm run smoke:package -- --output "${PACKAGE_TARBALL}"

      - name: Dry-run npm publish
        run: npm publish --dry-run "${PACKAGE_TARBALL}"

      - name: Remove packed package
        if: always()
        run: rm -f "${PACKAGE_TARBALL}"

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: 'npm'
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_TARBALL: /tmp/scheduler-package.tgz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install trusted-publishing npm CLI
        run: npm install --global npm@11.5.1

      - name: Verify npm CLI version
        run: npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [[ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match package version ${EXPECTED_TAG}."
            exit 1
          fi

      - name: Verify package
        run: pnpm run ci

      - name: Smoke-test and retain packed package
        run: pnpm run smoke:package -- --output "${PACKAGE_TARBALL}"

      - name: Publish to npm
        run: npm publish "${PACKAGE_TARBALL}"

      - name: Remove packed package
        if: always()
        run: rm -f "${PACKAGE_TARBALL}"
